[package]
name = "cargo-oxide"
version = "0.2.1"
edition = "2024"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/cuda-rust"
description = "Cargo subcommand for cuda-oxide: build and run Rust GPU programs"
readme = "README.md"

[[bin]]
name = "cargo-oxide"
path = "src/main.rs"

# Deliberately CUDA-free: no dependency here may pull `cuda-bindings`
# (or any other build script that needs the CUDA toolkit), so that
# `cargo oxide doctor` builds and runs on a machine with no toolkit and
# no driver. libnvvm-sys / nvjitlink-sys are pure-Rust runtime-dlopen
# crates and are fine.
[dependencies]
clap = { version = "4", features = ["derive"] }
cuda-artifact-finalizer = { git = "https://github.com/NVIDIA/cuda-rust", rev = "76ac1021660b0324c579d7cb57e847e7ffa3b9e1" }
libnvvm-sys = { git = "https://github.com/NVIDIA/cuda-rust", rev = "76ac1021660b0324c579d7cb57e847e7ffa3b9e1" }
nvjitlink-sys = { git = "https://github.com/NVIDIA/cuda-rust", rev = "76ac1021660b0324c579d7cb57e847e7ffa3b9e1" }
oxide-artifacts = "0.2.1"
oxide-tile-export = { git = "https://github.com/NVIDIA/cuda-rust", rev = "76ac1021660b0324c579d7cb57e847e7ffa3b9e1" }
oxide-tilebc = { git = "https://github.com/NVIDIA/cuda-rust", rev = "76ac1021660b0324c579d7cb57e847e7ffa3b9e1" }
ptx-parse = { git = "https://github.com/NVIDIA/cuda-rust", rev = "76ac1021660b0324c579d7cb57e847e7ffa3b9e1" }
ptx-schedule = { git = "https://github.com/NVIDIA/cuda-rust", rev = "76ac1021660b0324c579d7cb57e847e7ffa3b9e1" }
reserved-oxide-symbols = { git = "https://github.com/NVIDIA/cuda-rust", rev = "76ac1021660b0324c579d7cb57e847e7ffa3b9e1" }
serde_json = "1"
sha2 = "0.10"
toml = "1"
